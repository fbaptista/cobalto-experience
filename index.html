<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cobalto: unit testing, debugging and AI for COBOL. A session you can walk through." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cobalto experience</title>
  </head>
  <body>
    <main id="stage">
      <div id="monitor">
        <nav id="tabs" aria-label="Views of the session">
          <button data-tab="terminal" data-label="Terminal" class="on" aria-current="true">Terminal</button>
          <button data-tab="vscode" data-label="VS Code">VS Code</button>
          <button data-tab="ci" data-label="CI">CI</button>
          <button data-tab="agent" data-label="Agent">Agent <span class="ai">AI</span></button>
          <span class="spacer"></span>
          <button id="sound" aria-pressed="true">Sound on</button>
          <button id="install">Install</button>
        </nav>
        <div id="crt">
          <div id="screen" aria-label="Cobalto session terminal"></div>
        </div>
        <div id="badge">
          <img src="/cobalto-mark.svg" alt="" />
          <span>COBALTO</span>
          <i class="led" aria-hidden="true"></i>
        </div>
      </div>
    </main>
    <footer>
      IBM, Micro Focus, VSI and VS Code are trademarks of their respective owners, named here only to identify
      compatibility. Programs and data in this session are made up.
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
